pre-commit:
  jobs:
    - name: branch-name
      run: scripts/hooks/check-branch-name.sh
    - name: adr
      run: scripts/hooks/check-adr.sh

prepare-commit-msg:
  jobs:
    - name: draft-message
      run: scripts/hooks/draft-commit-msg.sh {0}

commit-msg:
  jobs:
    - name: refs
      run: scripts/hooks/add-refs.sh {1}
