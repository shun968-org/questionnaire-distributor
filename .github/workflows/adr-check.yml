name: adr-check

# ADR の書式と運用規則を、PR を取り込んだ結果と最新の main を比べて検査する。
# pre-commit(lefthook)を --no-verify で回避したときや、ほかの PR が先に main へ入れた
# ADR 番号との重なりを検出する。
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - docs/adr/**
      - scripts/check-adr-*.sh
      - scripts/lib/adr.sh
      - .github/workflows/adr-check.yml

# ラベルの付け外しや連続した push で、古い実行の結果が最後に残らないようにする
concurrency:
  group: adr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # 採用済み ADR の誤字・リンクだけを直す PR は、ラベルを付けて書き換えの検査を警告に下げる
      ADR_ALLOW_ADOPTED_EDIT: ${{ contains(github.event.pull_request.labels.*.name, 'adr-allow-adopted-edit') && '1' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 比較元の origin/main を取得する
          fetch-depth: 0

      # checkout した merge コミットは PR を作成・更新した時点の main を基にしている。
      # 比較元の origin/main(実行時点の最新)とそろえるため、最新の main を取り込んでから検査する。
      - name: 最新の main を取り込む
        run: |
          git -c user.name=adr-check -c user.email=adr-check@localhost merge --no-edit -q origin/main \
            || { echo "::error::最新の main と競合する。main に rebase して push する"; exit 1; }

      # PR で触っていない ADR の書式で止まらないよう、PR で追加・変更した ADR だけを検査する
      - name: 書式
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'docs/adr/*.md')
          if [ "${#files[@]}" -gt 0 ]; then
            scripts/check-adr-format.sh "${files[@]}"
          fi

      - name: 運用規則
        if: ${{ !cancelled() }}
        run: scripts/check-adr-rules.sh --base origin/main
